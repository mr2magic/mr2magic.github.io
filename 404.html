<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Snuffy Rhino Productions</title>
  <meta name="description" content="The page you were looking for could not be found.">
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for missing paths at any depth. The base
       keeps relative links working from nested URLs. Change it if the site
       moves to a subpath or a different domain. -->
  <base href="/">
  <style>
    :root {
      --bg: #FBFBFD;
      --text: #1D1D1F;
      --secondary: #6E6E73;
      --accent: #0066CC;
      --accent-hover: #0051A3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    main { max-width: 560px; }
    .code {
      font-size: clamp(64px, 14vw, 120px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0 0 16px;
    }
    h1 {
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 16px;
    }
    p { color: var(--secondary); font-size: 19px; margin: 0 0 32px; }
    .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 980px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    a.primary { background: var(--accent); color: #fff; }
    a.primary:hover { background: var(--accent-hover); }
    a.secondary { border: 1px solid var(--accent); color: var(--accent); }
    a.secondary:hover { background: var(--accent); color: #fff; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page wandered off.</h1>
    <p>The link may be old, or the page may have moved. Let's get you back to solid ground.</p>
    <div class="actions">
      <a class="primary" href="index.html">Go home</a>
      <a class="secondary" href="apps.html">Browse the apps</a>
    </div>
  </main>
</body>
</html>
